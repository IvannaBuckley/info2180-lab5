<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>World Database Lookup</title>

    <link href="world.css" type="text/css" rel="stylesheet" />
    <script src="world.js" type="text/javascript" defer></script>
  </head>

  <body>
    <header>
      <h1>World Database Lookup</h1>
      <p class="subtitle">
        Search for countries and their cities from the world database.
      </p>
    </header>

    <main>
      <section id="search-card">
        <div id="controls">
          <label for="country">Country name</label>
          <input
            id="country"
            type="search"
            name="country"
            placeholder="e.g. Jamaica, Canada, France"
          />

          <div class="button-row">
            <button id="lookup-country" class="primary-btn">
              Lookup Country
            </button>
            <button id="lookup-cities" class="secondary-btn">
              Lookup Cities
            </button>
          </div>
        </div>
      </section>

      <section id="result-section">
        <h2>Results</h2>
        <div id="result">
         
        </div>
      </section>
    </main>
  </body>
</html>
